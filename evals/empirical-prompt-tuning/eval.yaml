name: empirical-prompt-tuning-eval
description: empirical-prompt-tuning スキルの評価スイート
skill: empirical-prompt-tuning
version: "1.0"

config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  fail_fast: false
  executor: mock
  model: claude-opus-4.6
  skill_directories:
    - "skills"

graders:
  - type: text
    name: has_iteration_record
    weight: 2.0
    config:
      regex_match:
        - 'Iteration\s+\d+'

  - type: text
    name: has_both_sides_evaluation
    weight: 2.0
    config:
      regex_match:
        - '(自己申告|executor_report|agent_report|不明瞭点)'

  - type: text
    name: has_convergence_check
    weight: 1.5
    config:
      regex_match:
        - '(収束|打ち切り|converge|改善なし)'

  - type: text
    name: dispatches_new_subagent
    weight: 2.0
    config:
      regex_match:
        - '(新規.*subagent|dispatch|バイアス排除)'

  - type: behavior
    name: tool_call_budget
    weight: 0.5
    config:
      max_tool_calls: 20
      max_tokens: 200000

tasks:
  - "tasks/*.yaml"

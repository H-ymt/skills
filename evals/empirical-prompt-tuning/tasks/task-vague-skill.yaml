id: empirical-prompt-tuning-vague-skill
name: 曖昧なスキルの改善ワークフロー実行
description: |
  不明瞭な記述を持つ SKILL.md に対して empirical-prompt-tuning を適用し、
  正しい反復改善ワークフローを実行できるか検証する。
  バイアス排除のための新規 subagent dispatch、両面評価、収束判定が含まれているかを評価する。

tags:
  - empirical-prompt-tuning
  - improvement
  - iteration

inputs:
  prompt: |
    fixtures/vague-skill-sample.md は品質が低いスキル定義です。
    empirical-prompt-tuning ワークフローを適用して改善してください。
    Iteration 0 から開始し、少なくとも 2 回の反復を行い、
    各イテレーションの評価結果（自己申告 + メトリクス）を記録してください。
  files:
    - path: vague-skill-sample.md

expected:
  output_contains_any:
    - "Iteration"
    - "イテレーション"
  behavior:
    max_tool_calls: 20
    max_response_time_ms: 120000
